<svg xmlns="http://www.w3.org/2000/svg" width="420" height="280" viewBox="0 0 420 280">
  <g transform="rotate(25 210 140)" fill="#718398" fill-opacity=".07" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15">
    <text x="300" y="-10">∇f(x)</text>
    <text x="350" y="0">∑ᵢ xᵢ</text>
    <text x="80" y="310">E[X²] = Var(X) + μ²</text>
    <text x="18" y="38">∫ f(x) dx = F(x) + C</text>
    <text x="238" y="48">σ² = E[(X − μ)²]</text>
    <text x="8" y="91">E[R] = μ</text>
    <text x="108" y="91">rₜ = ln(Pₜ / Pₜ₋₁)</text>
    <text x="8" y="144">Σ wᵢ rᵢ</text>
    <text x="153" y="135">∂f / ∂x</text>
    <text x="250" y="131">lim Δt → 0</text>
    <text x="128" y="183">β = Cov(X,Y) / Var(X)</text>
    <text x="285" y="190">P(A ∩ B)</text>
    <text x="15" y="231">P(X &gt; x) = 1 − F(x)</text>
    <text x="267" y="246">∂L / ∂θ = 0</text>
    <text x="152" y="272">Σₜ rₜ</text>
  </g>
</svg>
