[project]
name = "quantogral"
version = "0.1.0"
description = "A local-first quantitative research platform with C++ strategies and Python analysis."
readme = "README.md"
requires-python = ">=3.13"

license = { text = "Apache-2.0" }

authors = [
    { name = "Jacopo Michelacci" }
]

dependencies = [
    "polars>=1.39.3",
    "yfinance>=1.2.0",
]


[project.urls]
Repository = "https://github.com/JacopoMichelacci/quantogral.git"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.7",
]
